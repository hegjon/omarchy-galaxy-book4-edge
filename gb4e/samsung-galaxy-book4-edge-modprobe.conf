# Samsung Galaxy Book4 Edge 14: the ADSP firmware has no PMIC GLINK service,
# so qcom_battmgr's power supplies never answer (every read is -EAGAIN; even
# their uevents fail, so a udev UPOWER_IGNORE rule never applies). UPower and
# Omarchy's battery status would pick the dead qcom-battmgr-bat over the EC
# driver's samsung-galaxybook-bat. Keep qcom_battmgr from loading.
blacklist qcom_battmgr
