# Samsung Galaxy Book4 Edge 14: the 4-channel speaker sink is tweeters on
# FL/FR and woofers on RL/RR. The default psd upmix puts only the left/right
# difference on the rear channels, so centred sound (voices, bass) never
# reaches the woofers. Copy front to rear instead.
stream.properties = {
    channelmix.upmix        = true
    channelmix.upmix-method = simple
}
