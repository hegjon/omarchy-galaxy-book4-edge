# Samsung Galaxy Book4 Edge 14: the built-in keyboard and touchpad are HID over
# I2C, and autodetect leaves them out, so the LUKS prompt would get no keyboard.
MODULES+=(i2c-hid-of hid-generic hid-multitouch)
# Keep msm (display + GPU) out of the initramfs so simpledrm shows the LUKS
# prompt; see /usr/lib/initcpio/install/samsung-galaxy-book4-edge-14.
HOOKS+=(samsung-galaxy-book4-edge-14)
