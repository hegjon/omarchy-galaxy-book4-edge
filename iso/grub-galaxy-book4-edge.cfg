# Samsung Galaxy Book4 Edge 14" (NP940XMA/NP944XMA). The firmware provides no
# device tree and the live UKI has none for this machine, so GRUB boots the
# kernel and the UKI's initramfs with the tree itself. GRUB refuses devicetree
# under Secure Boot, so that has to be off. The default entry keeps msm out of
# the live system; the installer was tested on the firmware framebuffer
# (simpledrm). The msm entry uses the display driver instead.
menuentry "Omarchy (Galaxy Book4 Edge 14)" --class arch --class gnu-linux --class gnu --class os --id 'galaxy-book4-edge-14' {
    linux /arch/boot/aarch64/vmlinuz-linux-omarchy archisobasedir=arch archisosearchuuid=@ARCHISO_UUID@ initramfs_async=0 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0 iommu.passthrough=0 omarchy.qcom_early=1 usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas,msm quiet splash
    initrd /arch/boot/aarch64/initramfs-linux-omarchy-uki.img
    devicetree /boot/dtbs/x1e80100-samsung-galaxy-book4-edge-14.dtb
}

menuentry "Omarchy (Galaxy Book4 Edge 14, verbose boot log)" --class arch --class gnu-linux --class gnu --class os --id 'galaxy-book4-edge-14-verbose' {
    linux /arch/boot/aarch64/vmlinuz-linux-omarchy archisobasedir=arch archisosearchuuid=@ARCHISO_UUID@ initramfs_async=0 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0 iommu.passthrough=0 omarchy.qcom_early=1 usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas,msm console=tty0 loglevel=7 ignore_loglevel earlycon systemd.show_status=1 plymouth.enable=0
    initrd /arch/boot/aarch64/initramfs-linux-omarchy-uki.img
    devicetree /boot/dtbs/x1e80100-samsung-galaxy-book4-edge-14.dtb
}

menuentry "Omarchy (Galaxy Book4 Edge 14, verbose, msm display driver)" --class arch --class gnu-linux --class gnu --class os --id 'galaxy-book4-edge-14-msm' {
    linux /arch/boot/aarch64/vmlinuz-linux-omarchy archisobasedir=arch archisosearchuuid=@ARCHISO_UUID@ initramfs_async=0 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0 iommu.passthrough=0 omarchy.qcom_early=1 usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas console=tty0 loglevel=7 ignore_loglevel earlycon systemd.show_status=1 plymouth.enable=0
    initrd /arch/boot/aarch64/initramfs-linux-omarchy-uki.img
    devicetree /boot/dtbs/x1e80100-samsung-galaxy-book4-edge-14.dtb
}

# The installer registers the Limine boot entry itself: the tree lets the
# kernel use QSEECOM, so EFI variables work. If the firmware still has no
# entry, this runs startup.nsh in the UEFI Shell, which adds one with bcfg.
menuentry "Add Omarchy boot entry (UEFI Shell)" --class efi --id 'gb4e-add-boot-entry' {
    search --no-floppy --label ARCHISO_EFI --set=esp
    chainloader ($esp)/EFI/tools/shellaa64.efi
}

default=galaxy-book4-edge-14
timeout=5
timeout_style=menu

